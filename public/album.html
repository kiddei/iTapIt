<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albums</title>
  <!-- Custom Style -->
  <link rel="stylesheet" href="styles/home.css">
  <link rel="stylesheet" href="styles/swiper.css">
  <link rel="stylesheet" href="styles/album.css">
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" 
  integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <!-- Google Font (Poppins) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="overlay"></div>
  <!-- Header -->
  <header>
      <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid px-4">
          <!-- Left: Logo + Name -->
          <a class="navbar-brand d-flex align-items-center fw-bold" href="#">
            <img src="images/icon.svg" alt="Logo" width="28" class="me-2">
            iTapIT
          </a>

          <!-- Hamburger -->
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="custom-toggler-icon">
              <div></div>
            </span>
          </button>

          <!-- Middle: Navbar links -->
          <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item"><a class="nav-link px-3 text-white" href="home.html">Home</a></li>
              <li class="nav-item"><a class="nav-link px-3 text-white" href="explore.html">Explore</a></li>
              <li class="nav-item"><a class="nav-link px-3 text-white" href="album.html">Albums</a></li>
            </ul>
          </div>

          <input 
          type="file" 
          id="fileUpload" 
          accept="image/*,video/*" 
          multiple 
          style="display:none;" />

          <!-- Right: Button -->
          <div class="d-none d-lg-flex">
            <button class="btn btn-hero-secondary px-4 py-2 rounded-pill text-white d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#createAlbumModal">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-circle" viewBox="0 0 16 16">
              <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
              <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
              </svg>
              Create Album
            </button>
          </div>

        </div>
      </nav>
  </header>

<!-- Modal Form for Creating Album -->
<div class="modal fade" id="createAlbumModal" tabindex="-1" aria-labelledby="createAlbumModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark text-white rounded-4">
      <div class="modal-header">
        <h5 class="modal-title" id="createAlbumModalLabel">Create New Album</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <!-- Album Title -->
          <div class="mb-3">
            <label for="albumTitle" class="form-label">Album Title</label>
            <input type="text" class="form-control" id="albumTitle" placeholder="Enter album title" required>
          </div>
          <!-- Album Description -->
          <div class="mb-3">
            <label for="albumDescription" class="form-label">Description</label>
            <textarea class="form-control" id="albumDescription" rows="3" placeholder="Write something about this album..."></textarea>
          </div>
          <!-- Upload Photos -->
          <!-- <div class="mb-3">
            <label for="albumPhotos" class="form-label">Upload Photos</label>
            <input class="form-control" type="file" id="albumPhotos" multiple>
          </div> -->
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-hero-primary rounded-pill text-white">Create</button>
      </div>
    </div>
  </div>
</div>

  <!-- Main Content -->
<section class="container-fluid p-4 pt-5">
  <!-- Title & Sub-description -->
  <div class="text-white mb-3">
    <h2 class="hero-title fw-bold mb-2">Album Collection</h2>
    <p class="hero-description text-white-50 mb-0">
      Browse through curated albums filled with unforgettable moments, meaningful highlights, and memories worth revisiting.
    </p>
  </div>

  <!-- Mobile-only Start Sharing + Filter -->
  <div class="d-lg-none d-flex justify-content-between align-items-center mb-5">
    <button class="btn btn-hero-secondary start-sharing-btn px-4 py-2 rounded-pill text-white d-flex align-items-center gap-2 w-auto">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-circle" viewBox="0 0 16 16">
        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
        <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
      </svg>
        Create Album
      </button>
  </div>

<div class="row row-cols-1 row-cols-md-3 g-4">
  <!-- JS inserts here -->
</div>
</section>



<!-- Lightbox Modal -->
<div id="lightboxModal" class="lightbox-modal">
  <span class="lightbox-close">&times;</span>
  
  <!-- Arrows -->
<span class="lightbox-prev">&#10094;</span>
<span class="lightbox-next">&#10095;</span>

  <!-- Image -->
  <img class="lightbox-content" id="lightboxImage">
</div>



  <!-- Bootstrap JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" 
  integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  <script src="scripts/swiper.js"></script>
  <script src="scripts/upload.js"></script>
  <script src="scripts/home.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="scripts/album.js"></script>
</body>
</html>
