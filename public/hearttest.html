<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Double Tap Test</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #111;
    }

    .post {
      position: relative;
      width: 300px;
      height: 400px;
      background: url("https://picsum.photos/300/400") no-repeat center center/cover;
      border-radius: 12px;
      overflow: hidden;
    }

    .doubletap-heart {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      width: 120px;
      height: 120px;
      opacity: 0;
      pointer-events: none;
      animation: pop 0.8s ease forwards;
    }

    @keyframes pop {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="post" id="post"></div>

  <script>
    const post = document.getElementById("post");

    post.addEventListener("dblclick", () => {
      console.log("Double tapped!");
      const heart = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      heart.setAttribute("viewBox", "0 0 24 24");
      heart.setAttribute("fill", "red");
      heart.setAttribute("class", "doubletap-heart");
      heart.innerHTML = `<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 
        12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 
        3.41.81 4.5 2.09C13.09 3.81 14.76 
        3 16.5 3 19.58 3 22 5.42 22 
        8.5c0 3.78-3.4 6.86-8.55 
        11.54L12 21.35z"/>`;

      post.appendChild(heart);

      setTimeout(() => heart.remove(), 1000);
    });
  </script>
</body>
</html>
