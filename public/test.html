<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SharedLens Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f8f9fa;
    }
    h1 {
      text-align: center;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 10px;
      text-align: center;
    }
    .card img {
      max-width: 100%;
      border-radius: 6px;
    }
    .media-id {
      margin-top: 8px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>Shared Lens Gallery Test</h1>
  <div class="gallery" id="gallery"></div>

  <script>
    async function loadMedia() {
      try {
        const res = await fetch("http://localhost:3000/media");
        const media = await res.json();

        const gallery = document.getElementById("gallery");
        gallery.innerHTML = "";

        media.forEach(item => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <img src="${item.media_link}" alt="Media ${item.media_id}">
            <div class="media-id">ID: ${item.media_id}</div>
          `;
          gallery.appendChild(card);
        });
      } catch (err) {
        console.error("Failed to load media:", err);
      }
    }

    loadMedia();
  </script>
</body>
</html>
