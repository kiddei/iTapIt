<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Event Access | iTapIt</title>
  <link rel="stylesheet" href="styles/index.css" />
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Font (Poppins) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Header (same style as homepage) -->
  <header>
  <nav class="navbar navbar-expand-lg navbar-dark justify-content-center">
    <a class="navbar-brand d-flex align-items-center fw-bold" href="home.html">
      <img src="images/icon.svg" alt="Logo" width="28" class="me-2">
      iTapIT
    </a>
  </nav>
</header>

  <!-- Main Content -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center text-center text-white">
    <div class="container" style="max-width: 500px;">
      <h1 id="event-title" class="fw-bold mb-3">[Event Title Here]</h1>
      <p id="event-venue" class="mb-1 text-white-50">[Event Venue Here]</p>
      <p id="event-date" class="mb-4 text-white-50">[Event Date & Time Here]</p>

      <!-- Passcode Form -->
      <form id="eventForm" class="form d-flex flex-column gap-3">
        <input 
          type="password" 
          id="passcode" 
          placeholder="Enter Passcode" 
          required 
          class="form-control form-control-lg rounded-pill text-center"
        />
        <button type="submit" class="btn btn-gradient btn-lg rounded-pill fw-semibold">
          Take Me There
        </button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer text-center text-white-50 py-4 mt-auto">
    <p class="mb-1">
      Powered by <a href="https://itapit.com" target="_blank" class="fw-semibold text-gradient">iTapIt</a>
    </p>
    <p class="mb-1">Email: <a href="mailto:contact@itapit.com" class="text-white-50">contact@itapit.com</a></p>
    <p class="mb-3">Contact: +63 912 345 6789</p>
    <div class="socials d-flex justify-content-center gap-3">
      <a href="#" class="social-icon fb"></a>
      <a href="#" class="social-icon tw"></a>
      <a href="#" class="social-icon ig"></a>
    </div>
  </footer>

<script src="scripts/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
