<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore</title>
  <!-- Custom Style -->
  <link rel="stylesheet" href="styles/home.css">
  <link rel="stylesheet" href="styles/swiper.css">
  <link rel="stylesheet" href="styles/explore.css">
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" 
  integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <!-- Google Font (Poppins) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Swiper CSS 
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>-->

  
</head>
<body> 
  <div class="overlay"></div>

  <!-- Header -->
  <header>
      <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid px-4">
          <!-- Left: Logo + Name -->
          <a class="navbar-brand d-flex align-items-center fw-bold" href="#">
            <img src="images/icon.svg" alt="Logo" width="28" class="me-2">
            iTapIT
          </a>

          <!-- Hamburger -->
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="custom-toggler-icon">
              <div></div>
            </span>
          </button>

          <!-- Middle: Navbar links -->
          <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item"><a class="nav-link px-3 text-white" href="home.html">Home</a></li>
              <li class="nav-item"><a class="nav-link px-3 text-white" href="explore.html">Explore</a></li>
              <li class="nav-item"><a class="nav-link px-3 text-white" href="#">Albums</a></li>
              <!-- Show button inside hamburger menu -->
              <li class="nav-item d-lg-none mt-3">
                <button class="btn btn-gradient px-4 py-2 rounded-pill text-white d-flex align-items-center gap-2 w-100">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#ffffff" class="bi bi-camera-fill" viewBox="0 0 16 16">
                    <path d="M10.5 8.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"/>
                    <path d="M2 4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1.172a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 9.172 2H6.828a2 2 0 0 0-1.414.586l-.828.828A2 2 0 0 1 3.172 4zm.5 2a.5.5 0 1 1 0-1 .5.5 0 0 1 0 1m9 2.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0"/>
                  </svg>
                  Start Sharing
                </button>
              </li>
            </ul>
          </div>

          <input 
          type="file" 
          id="fileUpload" 
          accept="image/*,video/*" 
          multiple 
          style="display:none;" />

          <!-- Right: Button -->
          <div class="d-none d-lg-flex">
            <button class="btn btn-gradient px-4 py-2 rounded-pill text-white d-flex align-items-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#ffffff" class="bi bi-camera-fill" viewBox="0 0 16 16">
                <path d="M10.5 8.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"/>
                <path d="M2 4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1.172a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 9.172 2H6.828a2 2 0 0 0-1.414.586l-.828.828A2 2 0 0 1 3.172 4zm.5 2a.5.5 0 1 1 0-1 .5.5 0 0 1 0 1m9 2.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0"/>
              </svg>
              Start Sharing
            </button>
          </div>
        </div>
      </nav>
  </header>

  <section class="container-fluid py-4">
  <div id="gallery" class="masonry">
    <div class="masonry-item">
      <img data-src="images/blur.jpg" alt="Photo 1" class="lazy">
    </div>
    <div class="masonry-item">
      <video data-src="images/test_demo.mp4" preload="none" muted playsinline loop class="lazy">
        Your browser does not support the video tag.
      </video>
    </div>
    <div class="masonry-item">
      <img data-src="images/1.JPG" alt="Photo 2" class="lazy">
    </div>
    <div class="masonry-item">
      <img data-src="images/2.JPG" alt="Photo 3" class="lazy">
    </div>
    <div class="masonry-item">
      <img data-src="images/3.JPG" alt="Photo 4" class="lazy">
    </div>
    <div class="masonry-item">
      <img data-src="images/4.JPG" alt="Photo 5" class="lazy">
    </div>
    <div class="masonry-item">
      <img data-src="images/5.JPG" alt="Photo 6" class="lazy">
    </div>
    <div class="masonry-item">
      <img data-src="images/6.JPG" alt="Photo 7" class="lazy">
    </div>
    <div class="masonry-item">
      <img data-src="images/7.JPG" alt="Photo 8" class="lazy">
    </div>
    <div class="masonry-item">
      <img data-src="images/8.JPG" alt="Photo 3" class="lazy">
    </div>
    <div class="masonry-item">
      <img data-src="images/lola.jpg" alt="Photo 3" class="lazy">
    </div>
  </div>
</section>

    

  <!-- Lightbox Modal -->
<div id="lightbox" class="lightbox">
  <span class="close">&times;</span>
  <div class="lightbox-content">
    <img id="lightbox-img" style="display:none;" />
    <video id="lightbox-video" controls autoplay muted loop style="display:none;">
      <source id="lightbox-video-src" src="" type="video/mp4">
    </video>
  </div>
</div>
  <!-- Bootstrap JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" 
  integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  <script src="scripts/swiper.js"></script>
  <script src="scripts/upload.js"></script>
  <script src="scripts/home.js"></script>
  <script src="scripts/explore.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    
</body>
</html>
