<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <!-- Custom Style -->
  <link rel="stylesheet" href="home.css">
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" 
  integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <!-- Google Font (Poppins) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body> 
  <div class="overlay"></div>

  <!-- Header -->
  <header>
      <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid px-4">
          <!-- Left: Logo + Name -->
          <a class="navbar-brand d-flex align-items-center fw-bold" href="#">
            <img src="images/icon.svg" alt="Logo" width="28" class="me-2">
            iTapIt
          </a>

          <!-- Hamburger -->
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="custom-toggler-icon">
              <div></div>
            </span>
          </button>

          <!-- Middle: Navbar links -->
          <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item"><a class="nav-link px-3 text-white" href="#">Home</a></li>
              <li class="nav-item"><a class="nav-link px-3 text-white" href="#">Explore</a></li>
              <li class="nav-item"><a class="nav-link px-3 text-white" href="#">Albums</a></li>
              <!-- Show button inside hamburger menu -->
              <li class="nav-item d-lg-none mt-3">
                <button class="btn btn-gradient px-4 py-2 rounded-pill text-white d-flex align-items-center gap-2 w-100">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#ffffff" class="bi bi-camera-fill" viewBox="0 0 16 16">
                    <path d="M10.5 8.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"/>
                    <path d="M2 4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1.172a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 9.172 2H6.828a2 2 0 0 0-1.414.586l-.828.828A2 2 0 0 1 3.172 4zm.5 2a.5.5 0 1 1 0-1 .5.5 0 0 1 0 1m9 2.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0"/>
                  </svg>
                  Start Sharing
                </button>
              </li>
            </ul>
          </div>

          <!-- Right: Button -->
          <div class="d-none d-lg-flex">
            <button class="btn btn-gradient px-4 py-2 rounded-pill text-white d-flex align-items-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#ffffff" class="bi bi-camera-fill" viewBox="0 0 16 16">
                <path d="M10.5 8.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"/>
                <path d="M2 4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1.172a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 9.172 2H6.828a2 2 0 0 0-1.414.586l-.828.828A2 2 0 0 1 3.172 4zm.5 2a.5.5 0 1 1 0-1 .5.5 0 0 1 0 1m9 2.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0"/>
              </svg>
              Start Sharing
            </button>
          </div>
        </div>
      </nav>
  </header>

  <!-- Main Content -->
  <main class="container-fluid d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 80px);">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8 text-center text-white">
        <!-- Hero Title -->
        <h1 class="hero-title mb-4">Discover and Share on <span class="text-gradient">iTapIt</span></h1>

        <!-- Hero Description -->
        <p class="hero-description mb-5 mx-auto" style="max-width: 600px;">
          Lorem Ipsum has been the industry's standard dummy text ever since the 1500s, when an unknown printer took a galley of type 
          and scrambled it to make a type specimen book. 
        </p>
        
        <!-- Hero Buttons -->
        <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center align-items-center">
          <a href="#" class="btn btn-hero-primary btn-lg px-4 py-3 rounded-pill text-white d-flex align-items-center gap-2" style="min-width: 180px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-images" viewBox="0 0 16 16">
              <path d="M4.502 9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3"/>
              <path d="M14.002 13a2 2 0 0 1-2 2h-10a2 2 0 0 1-2-2V5A2 2 0 0 1 2.002 3h10a2 2 0 0 1 2 2v8a2 2 0 0 1-1.998 2M14.002 5a1 1 0 0 0-1-1h-10a1 1 0 0 0-1 1v8l2.646-2.354a.5.5 0 0 1 .63-.062l2.66 1.773 3.71-3.71a.5.5 0 0 1 .577-.094l1.777 1.947z"/>
            </svg>
            Browse Gallery
          </a>
          
          <a href="#" class="btn btn-hero-secondary btn-lg px-4 py-3 rounded-pill d-flex align-items-center gap-2" style="min-width: 180px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-plus-circle" viewBox="0 0 16 16">
              <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
              <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
            </svg>
            Create Album
          </a>
        </div>
      </div>
    </div>
  </main>
  
  <!-- Bootstrap JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" 
  integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
